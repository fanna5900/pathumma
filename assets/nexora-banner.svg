<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#011814" />
      <stop offset="50%" stop-color="#022a22" />
      <stop offset="100%" stop-color="#041f1a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03382d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#01241d" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="120" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="160" fill="#059669" opacity="0.1" filter="url(#glow)" />
  <circle cx="650" cy="200" r="180" fill="#14b8a6" opacity="0.08" filter="url(#glow)" />

  <!-- Grid Accents -->
  <g opacity="0.05" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Brand Badge -->
  <g transform="translate(80, 60)">
    <rect width="260" height="36" rx="18" fill="#023b30" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="20" cy="18" r="6" fill="#10b981" />
    <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0" letter-spacing="1">STATE ACADEMIC ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">
    NEX<tspan fill="url(#accentGrad)">ORA</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
    Higher Education &amp; School Admissions Registry • Verified Curricula &amp; Gazette Fees
  </text>

  <!-- Feature Highlights Row -->
  <g transform="translate(80, 245)">
    <!-- Pill 1: Universities -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">🏛️ 51 Institutions</text>
    </g>
    <!-- Pill 2: Schools -->
    <g transform="translate(195, 0)">
      <rect width="180" height="42" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">🏫 DHSE &amp; CBSE</text>
    </g>
    <!-- Pill 3: Courses -->
    <g transform="translate(390, 0)">
      <rect width="180" height="42" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">📖 96 Verified Fees</text>
    </g>
    <!-- Pill 4: Admission -->
    <g transform="translate(585, 0)">
      <rect width="200" height="42" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">📝 7-Step Admissions</text>
    </g>
    <!-- Pill 5: Resources -->
    <g transform="translate(800, 0)">
      <rect width="190" height="42" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">⚡ ISO PDF Downloads</text>
    </g>
  </g>

  <!-- Bottom Badges / Tech Row -->
  <g transform="translate(80, 345)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">
    <text x="0" y="0">Built with: React 18 • TypeScript • Tailwind CSS • Vite • Node.js • Express • SQLite • Prisma ORM</text>
  </g>
</svg>
